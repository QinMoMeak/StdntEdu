  /growth-events:
    get: {operationId: listGrowthEvents, summary: 查询成长事件, description: '仅返回未删除事件，按 eventDate DESC、createdAt DESC、id DESC 稳定排序。startDate 与 endDate 均为包含边界；startDate > endDate 返回 422。列表附件通过页面事件 ID 批量加载。', parameters: [{name: studentId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}, {name: eventType, in: query, schema: {type: string}}, {name: startDate, in: query, description: '包含边界：event_date >= startDate。', schema: {type: string, format: date}}, {name: endDate, in: query, description: '包含边界：event_date <= endDate。', schema: {type: string, format: date}}, {name: keyword, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/GrowthEventPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    post: {operationId: createGrowthEvent, summary: 新增成长事件, description: 'eventType 使用已启用的 growth_event_type 字典编码。attachmentIds 顺序保存为 sortOrder 0..N-1；事件与全部 GROWTH_EVENT/ATTACHMENT 关系在同一事务创建。', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GrowthEventCreateRequest'}}}}, responses: {'201': {$ref: '#/components/responses/GrowthEventOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /growth-events/{eventId}:
    parameters: [{$ref: '#/components/parameters/EventId'}]
    get: {operationId: getGrowthEvent, summary: 查询成长事件详情, responses: {'200': {$ref: '#/components/responses/GrowthEventOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    put: {operationId: updateGrowthEvent, summary: 修改成长事件, description: 'attachmentIds 是完整目标集合，不是增量追加；事件字段、乐观锁更新与附件关系替换在同一事务提交。', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GrowthEventUpdateRequest'}}}}, responses: {'200': {$ref: '#/components/responses/GrowthEventOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    delete: {operationId: deleteGrowthEvent, summary: 删除成长事件, description: '按 version 乐观锁逻辑删除事件并解除 GROWTH_EVENT 附件关系；Attachment 记录与物理文件保留。', parameters: [{name: version, in: query, required: true, schema: {type: integer, minimum: 0}}], responses: {'204': {description: 删除成功}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /reports:
