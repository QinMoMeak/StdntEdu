services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: student_growth
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
  backend:
    image: student-growth-backend:latest
    depends_on: [mysql]
    ports: ["${BACKEND_PORT}:8080"]
  frontend:
    image: student-growth-frontend:latest
    depends_on: [backend]
    ports: ["${FRONTEND_PORT}:80"]
volumes:
  mysql_data:
