spring:
  datasource:
    url: jdbc:mysql://mysql:3306/student_growth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:student_growth}
    password: ${MYSQL_PASSWORD:student_growth}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
