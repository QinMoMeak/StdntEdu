openapi: 3.1.0
info: {title: Student Growth Archive API, version: 3.12.0, license: {name: MIT, identifier: MIT}}
servers: [{url: /api/v1}]
security: [{bearerAuth: []}]
paths:
  /students:
    get: {operationId: listStudents, summary: 查询学生列表, responses: {'200': {$ref: '#/components/responses/StudentList'}, '401': {$ref: '#/components/responses/Unauthorized'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    post:
      operationId: createStudent
      summary: 新增学生
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudentCreate'}}}}
      responses: {'201': {$ref: '#/components/responses/StudentOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /students/{studentId}:
    parameters: [{$ref: '#/components/parameters/StudentId'}]
    get: {operationId: getStudent, summary: 查询学生详情, responses: {'200': {$ref: '#/components/responses/StudentOne'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    put:
      operationId: updateStudent
      summary: 修改学生
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudentUpdate'}}}}
      responses: {'200': {$ref: '#/components/responses/StudentOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /exams:
    post:
      operationId: createExam
      summary: 新增考试及成绩
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExamCreate'}}}}
      responses: {'201': {$ref: '#/components/responses/ExamOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /exams/{examId}:
    parameters: [{$ref: '#/components/parameters/ExamId'}]
    get: {operationId: getExam, summary: 查询考试, responses: {'200': {$ref: '#/components/responses/ExamOne'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    put:
      operationId: updateExam
      summary: 修改考试
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExamUpdate'}}}}
      responses: {'200': {$ref: '#/components/responses/ExamOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
    delete: {operationId: deleteExam, summary: 删除考试, responses: {'204': {description: 删除成功}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /wrong-questions:
    get:
      operationId: listWrongQuestions
      summary: 分页查询错题
      parameters: [{$ref: '#/components/parameters/StudentIdQuery'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/WrongPage'}, '401': {$ref: '#/components/responses/Unauthorized'}, '500': {$ref: '#/components/responses/InternalServerError'}}
    post:
      operationId: createWrongQuestion
      summary: 新增错题
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WrongCreate'}}}}
      responses: {'201': {$ref: '#/components/responses/WrongOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /wrong-questions/{wrongQuestionId}:
    parameters: [{$ref: '#/components/parameters/WrongId'}]
    get: {operationId: getWrongQuestion, summary: 查询错题, responses: {'200': {$ref: '#/components/responses/WrongOne'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    put:
      operationId: updateWrongQuestion
      summary: 修改错题
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WrongUpdate'}}}}
      responses: {'200': {$ref: '#/components/responses/WrongOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
    delete: {operationId: deleteWrongQuestion, summary: 删除错题, responses: {'204': {description: 删除成功}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /wrong-questions/{wrongQuestionId}/reviews:
    parameters: [{$ref: '#/components/parameters/WrongId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: submitWrongQuestionReview
      summary: 提交复习结果
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewCreate'}}}}
      responses: {'201': {$ref: '#/components/responses/ReviewOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /reviews/due:
    get:
      operationId: listDueReviews
      summary: 查询到期复习
      parameters: [{name: studentId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}, {name: before, in: query, schema: {type: string, format: date-time}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/WrongPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /resources:
    get:
      operationId: listResources
      summary: 分页查询资源
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/ResourcePage'}, '401': {$ref: '#/components/responses/Unauthorized'}, '500': {$ref: '#/components/responses/InternalServerError'}}
    post:
      operationId: createResource
      summary: 新增资源
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceCreate'}}}}
      responses: {'201': {$ref: '#/components/responses/ResourceOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /resources/{resourceId}:
    parameters: [{$ref: '#/components/parameters/ResourceId'}]
    get: {operationId: getResource, summary: 查询资源, responses: {'200': {$ref: '#/components/responses/ResourceOne'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    put:
      operationId: updateResource
      summary: 修改资源
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceUpdate'}}}}
      responses: {'200': {$ref: '#/components/responses/ResourceOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /resources/{resourceId}/history:
    post:
      operationId: createResourceHistory
      summary: 新增资源学习历史
      parameters: [{$ref: '#/components/parameters/ResourceId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResourceHistoryCreateRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/ResourceHistoryOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
    get:
      operationId: listResourceHistory
      summary: 查询资源学习历史
      parameters: [{$ref: '#/components/parameters/ResourceId'}, {name: studentId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/ResourceHistoryPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /resource-history:
    get:
      operationId: listStudentResourceHistory
      summary: 查询学生资源学习历史
      parameters: [{name: studentId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}, {name: subjectId, in: query, schema: {$ref: '#/components/schemas/Id'}}, {name: resourceType, in: query, schema: {type: string}}, {name: sourceType, in: query, schema: {type: string}}, {name: completed, in: query, schema: {type: boolean}}, {name: startDate, in: query, schema: {type: string, format: date}}, {name: endDate, in: query, schema: {type: string, format: date}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/ResourceHistoryPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /student-resources:
    get:
      operationId: listStudentResources
      summary: 分页查询学生资源队列
      parameters: [{name: studentId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}, {name: status, in: query, schema: {$ref: '#/components/schemas/StudentResourceStatus'}}, {name: subjectId, in: query, schema: {$ref: '#/components/schemas/Id'}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/StudentResourcePage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
    post:
      operationId: createStudentResource
      summary: 将资源加入学生资源队列
      description: student 必须存在，resource 必须存在且未逻辑删除；同一 student + resource 只能有一条 assignment，重复创建返回 409 DUPLICATE_DATA。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudentResourceCreateRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/StudentResourceOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /student-resources/{assignmentId}:
    parameters: [{$ref: '#/components/parameters/AssignmentId'}]
    get: {operationId: getStudentResource, summary: 查询学生资源分配详情, responses: {'200': {$ref: '#/components/responses/StudentResourceOne'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    put:
      operationId: updateStudentResource
      summary: 更新学生资源状态
      description: 仅允许修改学生资源状态和备注，不允许更换 studentId 或 resourceId；旧 version 返回 409 DATA_VERSION_CONFLICT。归档通过 studentStatus=ARCHIVED 表达，不提供物理删除接口。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudentResourceUpdateRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/StudentResourceOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /study-logs:
    get:
      operationId: listStudyLogs
      summary: 查询学习日志
      parameters: [{name: studentId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}, {name: subjectId, in: query, schema: {$ref: '#/components/schemas/Id'}}, {name: startDate, in: query, schema: {type: string, format: date}}, {name: endDate, in: query, schema: {type: string, format: date}}, {name: keyword, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {$ref: '#/components/responses/StudyLogPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
    post:
      operationId: createStudyLog
      summary: 新增学习日志
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyLogCreateRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/StudyLogOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /study-logs/{studyLogId}:
    parameters: [{$ref: '#/components/parameters/StudyLogId'}]
    get: {operationId: getStudyLog, summary: 查询学习日志, responses: {'200': {$ref: '#/components/responses/StudyLogOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    put:
      operationId: updateStudyLog
      summary: 修改学习日志
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyLogUpdateRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/StudyLogOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
    delete: {operationId: deleteStudyLog, summary: 删除学习日志, responses: {'204': {description: 删除成功}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /dashboard:
    get:
      operationId: getDashboard
      summary: 查询学生 Dashboard
      description: 若指定 academicTermId，则统计期从学期 startDate 到 min(endDate, targetDate)，targetDate 早于学期开始日时返回 422；未指定学期时使用含 targetDate 的固定 30 天窗口。date 未提供时由服务端按 dashboard ZoneId 确定目标日期。
      parameters: [{name: studentId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}, {name: academicTermId, in: query, schema: {$ref: '#/components/schemas/Id'}}, {name: date, in: query, schema: {type: string, format: date}}, {name: timezone, in: query, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/Dashboard'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /attachments:
    post:
      operationId: uploadAttachment
      summary: 上传附件
      description: 通用附件上传。Local V1 仅支持 JPEG、PNG、WebP 和 PDF；图片最大 15 MiB，PDF 最大 50 MiB，空文件不受支持。上传只创建未关联的附件元数据，业务归属由后续 entity_attachment 关系建立。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: 真实内容和声明 MIME 必须一致；允许 image/jpeg、image/png、image/webp、application/pdf。}
            encoding:
              file: {contentType: 'image/jpeg, image/png, image/webp, application/pdf'}
      responses: {'201': {$ref: '#/components/responses/AttachmentOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '415': {$ref: '#/components/responses/UnsupportedMediaType'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /attachments/{attachmentId}/content:
    parameters: [{$ref: '#/components/parameters/AttachmentId'}]
    get:
      operationId: downloadAttachment
      summary: 下载附件
      description: 按附件 ID 流式下载；不支持 Range/206，不暴露内部 storage path。Content-Disposition 固定为 attachment，并使用安全编码的原始文件名。
      responses:
        '200':
          description: 附件内容
          headers:
            Content-Disposition: {description: attachment disposition 与安全编码文件名, schema: {type: string}}
            Content-Length: {description: 文件字节数, schema: {type: integer, format: int64, minimum: 0}}
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /ai/models:
    get: {operationId: listAiModels, summary: 查询 AI 模型, responses: {'200': {$ref: '#/components/responses/AiModelList'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    post:
      operationId: createAiModel
      summary: 新增 AI 模型
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AiModelCreateRequest'}}}}
      responses: {'201': {$ref: '#/components/responses/AiModelOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /ai/models/{modelId}:
    parameters: [{$ref: '#/components/parameters/ModelId'}]
    get: {operationId: getAiModel, summary: 查询 AI 模型, responses: {'200': {$ref: '#/components/responses/AiModelOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    put:
      operationId: updateAiModel
      summary: 修改 AI 模型
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AiModelUpdateRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/AiModelOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /ai/models/{modelId}/test:
    parameters: [{$ref: '#/components/parameters/ModelId'}]
    post: {operationId: testAiModelConnection, summary: 测试 AI 模型连接, description: 只读测试已保存的模型配置；不得修改 enabled、version、API Key 或任何模型业务状态，响应必须脱敏。, responses: {'200': {$ref: '#/components/responses/AiConnectionTest'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /ai/models/{modelId}/enable:
    parameters: [{$ref: '#/components/parameters/ModelId'}]
    post: {operationId: enableAiModel, summary: 启用 AI 模型, description: 成功后 version 加一；旧 version 返回 409 DATA_VERSION_CONFLICT。, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AiModelStatusChangeRequest'}}}}, responses: {'200': {$ref: '#/components/responses/AiModelOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /ai/models/{modelId}/disable:
    parameters: [{$ref: '#/components/parameters/ModelId'}]
    post: {operationId: disableAiModel, summary: 停用 AI 模型, description: 成功后 version 加一；旧 version 返回 409 DATA_VERSION_CONFLICT。, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AiModelStatusChangeRequest'}}}}, responses: {'200': {$ref: '#/components/responses/AiModelOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /ai/wrong-question-extractions:
    post:
      operationId: createAiExtractionTask
      summary: 创建AI错题识别任务
      description: |
        客户端可按 multipart 文件顺序上传 JPEG、PNG、WEBP 和 PDF。AiInputType 表示客户端原始输入组成，
        不表示 Provider transport；PDF 即使已转换为页面图片，任务 inputType 仍为 PDF 或 MIXED。

        请求必须依次且独立满足六层容量限制：(L1) 文件数 <=20；(L2) 图片单文件 <=15 MB、PDF
        单文件 <=50 MB；(L3) 所有上传文件原始字节之和 <=268435456 bytes（256 MiB，不含 multipart
        boundary/header）；(L4) normalized visual units <=20；(L5) 每个最终解码或渲染 visual 的
        width <=8192、height <=8192 且 width*height <=16000000；(L6) 发送给 Provider 的全部 normalized
        image binary 在 Base64 前合计 <=134217728 bytes（128 MiB）。满足后层不得替代前层校验。

        创建任务前必须完成文件 preflight：验证真实 MIME/magic、文件可解析，并在完整 decode 前通过
        ImageReader 或等价安全 metadata API 读取 JPEG/PNG/WEBP 的 width 和 height；宽高与乘积必须
        使用 long 校验。静态 lossy、lossless 和 alpha WebP 支持，但 animated WebP（frame count >1
        或 animation flag=true）返回 422 BUSINESS_RULE_VIOLATION，禁止选取、合成或拆分帧，且不得创建
        Attachment、Extraction Task 或临时题。

        PDF preflight 必须确认非加密且无需密码、pageCount >=1，并在 renderImageWithDPI 前按每页
        CropBox 和 page rotation 计算 150 DPI raster。每一边使用
        ceil(effectivePoints / 72 * 150)，90/270 度交换有效宽高；计算采用 finite double 和 long，结果
        必须大于 0 并满足 8192/16000000 限制。损坏、不可解析、加密、需要密码或 0 页 PDF 返回
        422 BUSINESS_RULE_VIOLATION；尺寸超限返回 413 PAYLOAD_TOO_LARGE。失败时不得创建业务记录，
        临时文件必须清理。

        Normalized visual unit 的计算规则为：每个 JPEG/PNG/WEBP 文件计 1 unit，每个 PDF 页面计 1 unit，
        MIXED 为图片数量加全部 PDF 页数。单任务上传文件数和 normalized visual units 均不得超过 20；
        任一上限超出均返回 413 PAYLOAD_TOO_LARGE。图片单文件最大 15 MB，PDF 单文件最大 50 MB，
        文件大小、原始上传总量、visual unit、解码尺寸和 normalized binary 限制独立生效。单 visual
        的 estimatedRasterWorkingSet 固定按 decodedPixels*8 bytes 预算且不得超过 128 MiB；禁止依赖
        OutOfMemoryError 作为输入校验。

        Provider 永远不接收原始 PDF。PDF 按原页序使用安全的本地 renderer 渲染为 RGB 页面图片，
        基准为 150 DPI、JPEG quality 0.92；应用 PDF page rotation，但不得 OCR、提取 text layer、
        重排页面、跳过空白页、访问脚本、远程 URL 或外部网络资源。渲染图仅作为临时 Provider 输入，
        不创建 Attachment、不持久化、不返回客户端，并在处理结束后释放；原始 PDF Attachment 正常保留。
        静态 WEBP 在 Provider 调用前解码并固定归一化为 PNG，以保留 alpha 并避免二次有损压缩；不依赖
        Provider 原生 WEBP 支持。Derived PNG/JPEG 不改变 task.inputType。

        Normalized binary 按实际 Provider image bytes 在 Base64 前累计：JPEG 使用实际发送 bytes，PNG
        使用实际发送 bytes，WEBP 使用归一化 PNG bytes，PDF 使用 150 DPI/quality 0.92 页面 JPEG bytes。
        一旦累计超过 134217728 bytes，立即停止后续 normalization、清理 transient artifacts 并返回
        413，不得降 DPI、降 quality、丢页、改格式、chunk 或发起 Provider 调用。Base64 和 JSON 大小
        不计入该 128 MiB 业务值；Adapter 应流式 Base64/HTTP body，禁止为计算限制先构造完整 Base64
        String 和完整 JSON String。

        Provider visual input 严格保持 multipart 顺序，每个 PDF 在原文件位置展开为 page 1..N，
        不按 MIME 或文件名重排。一个 Extraction Task 默认只进行一次 Provider extraction 请求，
        不分块、不重叠、不去重、不执行多请求合并。

        OPENAI_COMPATIBLE 使用 POST {baseUrl}/chat/completions，不隐藏追加 /v1；请求 model=modelName、
        stream=false，user message 使用 TEXT part 加 IMAGE parts，JPEG/PNG 图片表示为对应 MIME 的
        data URL + base64。该协议子集不包含 Files、Assistants、Responses API 或 PDF native input。

        OLLAMA 使用 POST {baseUrl}/api/chat，请求 model=modelName、stream=false，user message 的 content
        为 extraction prompt，images 为 normalized image bytes 的纯 base64 数组，不含 data URL 前缀。
        可使用 format=json 或官方 JSON schema structured output，但 Adapter 必须返回内部强类型结果，
        不得把 Provider 原始 JSON 直接传给 Service。

        Provider 因 payload、图片、多模态、context limit 或协议问题拒绝请求时，整个任务失败；不得自动
        减少页面、降低 DPI、丢弃输入、OCR、分批或切换协议。Preflight 后发生页面渲染失败同样令任务
        FAILED，不得保存部分临时题。413 适用于文件数/大小、原始上传总量、visual units、解码宽高/
        像素和 normalized binary 超限；422 适用于损坏/加密/密码/零页 PDF 与 animated WebP；不支持的
        MIME 返回 415。Prompt 不得包含服务器存储路径、Secret、API Key 或无关学生数据。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files, studentId, sourceType, modelId]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: |
                    支持 JPEG、PNG、WEBP 和 PDF。图片单文件最大 15 MB，PDF 单文件最大 50 MB，
                    单任务最多 20 个文件，原始文件字节总和最多 256 MiB；同时按图片数加 PDF 总页数
                    计算 normalized visual units，总数不得超过 20。每个解码 visual 最大 8192x8192 且
                    不超过 16000000 pixels，Provider normalized binary 总计最多 128 MiB。Animated WebP
                    不受支持。文件顺序决定 Provider visual input 顺序，PDF 在原位置按页展开。
                  items: {type: string, format: binary}
                studentId: {$ref: '#/components/schemas/Id'}
                subjectId: {type: [string,'null']}
                gradeId: {type: [string,'null']}
                sourceType: {$ref: '#/components/schemas/WrongSource'}
                sourceName: {type: [string,'null']}
                examId: {type: [string,'null']}
                modelId: {$ref: '#/components/schemas/Id'}
                recognizeAnalysis: {type: boolean, default: false}
                matchKnowledge: {type: boolean, default: true}
                maskPersonalInfo: {type: boolean, default: false}
            encoding: {files: {contentType: 'image/jpeg, image/png, image/webp, application/pdf'}}
      responses: {'202': {$ref: '#/components/responses/AiTaskOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '415': {$ref: '#/components/responses/UnsupportedMediaType'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /ai/wrong-question-extractions/{taskId}:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get: {operationId: getAiExtractionTask, summary: 查询AI任务, responses: {'200': {$ref: '#/components/responses/AiTaskOne'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /ai/wrong-question-extractions/{taskId}/questions:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get: {operationId: listAiExtractionQuestions, summary: 查询识别临时题目, responses: {'200': {$ref: '#/components/responses/AiExtractionQuestionPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /ai/wrong-question-extractions/{taskId}/questions/{questionId}:
    parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/QuestionId'}]
    put:
      operationId: updateAiExtractionQuestion
      summary: 修改识别临时题目
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AiExtractionQuestionUpdateRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/AiExtractionQuestionOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /ai/wrong-question-extractions/{taskId}/confirm:
    parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: confirmAiExtractionTask
      summary: 确认识别结果
      description: 所有选中错题及映射在单一数据库事务中全部成功或全部回滚；相同 taskId、Idempotency-Key 和请求哈希返回首次结果，不允许部分成功。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AiExtractionConfirmRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/AiConfirmOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/IdempotencyConflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /ai/wrong-question-extractions/{taskId}/retry:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    post: {operationId: retryAiWrongQuestionExtraction, summary: 重试 AI 错题识别, description: '仅允许 FAILED 或 EXPIRED 状态重试。', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RetryAiExtractionRequest'}}}}, responses: {'202': {$ref: '#/components/responses/AiTaskOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /ai/wrong-question-extractions/{taskId}/cancel:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    post: {operationId: cancelAiWrongQuestionExtraction, summary: 取消 AI 错题识别, description: '仅允许 PENDING、RUNNING 或 REVIEW_REQUIRED 状态取消。', requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CancelAiExtractionRequest'}}}}, responses: {'200': {$ref: '#/components/responses/AiTaskOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /ai/analyses:
    get: {operationId: listAiAnalyses, summary: 查询 AI 分析历史, description: '默认按 create_time DESC、id DESC 稳定排序。startTime 与 endTime 过滤 create_time，采用 [startTime, endTime) 半开区间；startTime >= endTime 返回 422 BUSINESS_RULE_VIOLATION。当前 STUDY_PLAN_GENERATION 的 businessId 必须为空；仅提供 businessId，或同时提供 STUDY_PLAN_GENERATION 与非空 businessId，均返回 422。', parameters: [{name: studentId, in: query, schema: {$ref: '#/components/schemas/Id'}}, {name: businessType, in: query, schema: {$ref: '#/components/schemas/AiAnalysisBusinessType'}}, {name: businessId, in: query, schema: {$ref: '#/components/schemas/Id'}}, {name: modelId, in: query, schema: {$ref: '#/components/schemas/Id'}}, {name: status, in: query, schema: {$ref: '#/components/schemas/AiTaskStatus'}}, {name: startTime, in: query, description: '包含边界：create_time >= startTime。', schema: {type: string, format: date-time}}, {name: endTime, in: query, description: '排除边界：create_time < endTime。', schema: {type: string, format: date-time}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/AiAnalysisPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /ai/analyses/{analysisId}:
    parameters: [{$ref: '#/components/parameters/AnalysisId'}]
    get: {operationId: getAiAnalysis, summary: 查询 AI 分析详情, responses: {'200': {$ref: '#/components/responses/AiAnalysisOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /imports:
    get: {operationId: listImportTasks, summary: 查询导入任务, description: '按 createTime DESC、taskId DESC 稳定分页；时间范围使用 [startTime,endTime)。', parameters: [{name: importType, in: query, schema: {$ref: '#/components/schemas/ImportType'}}, {name: status, in: query, schema: {$ref: '#/components/schemas/ImportTaskStatus'}}, {name: studentId, in: query, schema: {$ref: '#/components/schemas/Id'}}, {name: startTime, in: query, schema: {type: string, format: date-time}}, {name: endTime, in: query, schema: {type: string, format: date-time}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/ImportPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    post:
      operationId: createImportTask
      summary: 创建导入任务
      description: '只持久化原文件并异步解析预览，不写业务数据。CSV/XLSX/JSON 最大 50 MiB；ZIP 最大 500 MiB，最多 20 个文件条目。ZIP 禁止目录穿越、绝对/盘符/UNC 路径、symlink、nested ZIP；单条目最多 50 MiB、总解压最多 200 MiB、压缩比最多 100:1、条目最多 20。CSV 固定 UTF-8、逗号、RFC4180 quote/escape、必需唯一 header；XLSX 最多 20 sheets/10000 rows/100 columns/65536 字符且拒绝公式；JSON 顶层数组，最多 10000 records、深度 20、字符串 65536。'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, importType]
              properties:
                file: {type: string, format: binary, description: 'CSV、XLSX、JSON 最大 50 MiB；ZIP 最大 500 MiB。'}
                importType: {$ref: '#/components/schemas/ImportType'}
                studentId: {type: [string,'null']}
                dryRun: {type: boolean, const: true, default: true, description: 'V1 固定为 true；正式写入只能通过 confirm。'}
                encoding: {type: string, enum: [UTF-8], default: UTF-8}
                sheetName: {type: [string,'null']}
                hasHeader: {type: boolean, const: true, default: true}
            encoding: {file: {contentType: 'text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/json, application/zip'}}
      responses: {'202': {$ref: '#/components/responses/ImportOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '413': {$ref: '#/components/responses/PayloadTooLarge'}, '415': {$ref: '#/components/responses/UnsupportedMediaType'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /imports/{taskId}:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get: {operationId: getImportTask, summary: 查询导入任务, responses: {'200': {$ref: '#/components/responses/ImportOne'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /imports/{taskId}/confirm:
    parameters: [{$ref: '#/components/parameters/TaskId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: confirmImportTask
      summary: 确认导入
      description: 'PREVIEW_READY -> CONFIRM_PENDING，commit 后异步写入。atomic=true 时所选行必须全部有效且业务写入全事务；atomic=false 仅与 skipInvalidRows=true 组合，跳过解析无效行，但所有合法行业务写入仍在一个事务中。Idempotency-Key 与规范请求哈希共同保证重放安全。'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ImportConfirmRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/ImportOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}
  /imports/{taskId}/cancel:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    post: {operationId: cancelImportTask, summary: 取消导入任务, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CancelImportRequest'}}}}, responses: {'200': {$ref: '#/components/responses/ImportOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /imports/{taskId}/errors:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    get: {operationId: downloadImportErrorReport, summary: 下载导入错误报告, description: 'UTF-8 CSV，不含 BOM；固定列 file,sheet,row,field,errorCode,message，不包含 SQL、stacktrace 或 storage path。', parameters: [{name: format, in: query, schema: {type: string, enum: [CSV], default: CSV}}], responses: {'200': {$ref: '#/components/responses/ImportErrorExport'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /imports/{taskId}/retry:
    parameters: [{$ref: '#/components/parameters/TaskId'}]
    post: {operationId: retryImportTask, summary: 重试导入任务, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RetryImportRequest'}}}}, responses: {'202': {$ref: '#/components/responses/ImportOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /exports:
    get: {operationId: listExportTasks, summary: 查询导出任务, description: '按 createTime DESC、taskId DESC 稳定分页；时间范围使用 [startTime,endTime)。', parameters: [{name: studentId, in: query, schema: {$ref: '#/components/schemas/Id'}}, {name: status, in: query, schema: {$ref: '#/components/schemas/ExportTaskStatus'}}, {name: format, in: query, schema: {$ref: '#/components/schemas/ExportFormat'}}, {name: startTime, in: query, schema: {type: string, format: date-time}}, {name: endTime, in: query, schema: {type: string, format: date-time}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/ExportPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    post:
      operationId: createExportTask
      summary: 创建导出任务
