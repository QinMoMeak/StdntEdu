    post: {operationId: createGrowthReport, summary: 新增成长报告, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GrowthReportCreateRequest'}}}}, responses: {'202': {$ref: '#/components/responses/GrowthReportOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /reports/{reportId}:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    get: {operationId: getGrowthReport, summary: 查询成长报告详情, responses: {'200': {$ref: '#/components/responses/GrowthReportOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /reports/{reportId}/regenerate:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    post: {operationId: regenerateGrowthReport, summary: 重新生成成长报告, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GrowthReportRegenerateRequest'}}}}, responses: {'202': {$ref: '#/components/responses/GrowthReportOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /reports/{reportId}/cancel:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    post: {operationId: cancelGrowthReport, summary: 取消成长报告生成, requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'200': {$ref: '#/components/responses/GrowthReportOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /reports/{reportId}/export:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    get: {operationId: exportGrowthReport, summary: 导出成长报告, parameters: [{name: format, in: query, required: true, schema: {type: string, enum: [MARKDOWN,PDF,JSON]}}, {name: includeAttachments, in: query, schema: {type: boolean, default: false}}], responses: {'200': {$ref: '#/components/responses/GrowthReportExport'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    StudentId: {name: studentId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ExamId: {name: examId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    WrongId: {name: wrongQuestionId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ResourceId: {name: resourceId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    AssignmentId: {name: assignmentId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    AttachmentId: {name: attachmentId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    BackupId: {name: backupId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    TaskId: {name: taskId, in: path, required: true, schema: {type: string}}
    StudentIdQuery: {name: studentId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 64}}
    TermId: {name: termId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    KnowledgeId: {name: knowledgeId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    StudyLogId: {name: studyLogId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ModelId: {name: modelId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    QuestionId: {name: questionId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    AnalysisId: {name: analysisId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    PlanId: {name: planId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    EventId: {name: eventId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ReportId: {name: reportId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
  schemas:
    Id: {type: string, pattern: '^[0-9]+$', example: '1'}
    Envelope: {type: object, required: [code,message,requestId,timestamp], properties: {code: {type: string}, message: {type: string}, requestId: {type: string}, timestamp: {type: string, format: date-time}}}
