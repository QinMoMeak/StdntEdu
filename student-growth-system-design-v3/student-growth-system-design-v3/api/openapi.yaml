    post: {operationId: createStudyPlanTask, summary: 新增计划任务, parameters: [{$ref: '#/components/parameters/PlanId'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyPlanTaskCreateRequest'}}}}, responses: {'201': {$ref: '#/components/responses/StudyPlanTaskOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /study-plans/{planId}/tasks/{taskId}:
