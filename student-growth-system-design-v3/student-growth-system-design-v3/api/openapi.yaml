    get: {operationId: listStudyPlans, summary: 查询学习计划, parameters: [{name: studentId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}, {name: status, in: query, schema: {$ref: '#/components/schemas/StudyPlanStatus'}}, {name: planType, in: query, schema: {type: string}}, {name: startDate, in: query, schema: {type: string, format: date}}, {name: endDate, in: query, schema: {type: string, format: date}}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/StudyPlanPage'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    post: {operationId: createStudyPlan, summary: 新增学习计划, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyPlanCreateRequest'}}}}, responses: {'201': {$ref: '#/components/responses/StudyPlanOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /study-plans/generate:
    post: {operationId: generateStudyPlan, summary: 生成学习计划, description: '校验学生、规范化请求以及已启用的 CHAT/MULTIMODAL 模型后，只创建 STUDY_PLAN_GENERATION/PENDING analysis 并返回 202，不创建占位 StudyPlan。input_json 保存 schemaVersion=1、promptVersion=study-plan-generation-v1 及规范化 StudyPlanGenerateRequest。相同 studentId、businessType、Idempotency-Key 和 requestHash 重放原 analysis 的当前状态，仍返回 202；相同 key 对应不同 hash 返回 409 IDEMPOTENCY_CONFLICT。成功 Worker 在同一事务创建 DRAFT StudyPlan/Tasks、设置 sourceAnalysisId、保存 StudyPlanDto result 快照并转为 SUCCESS；失败仅保存脱敏错误并转为 FAILED。', parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyPlanGenerateRequest'}}}}, responses: {'202': {$ref: '#/components/responses/AiAnalysisOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/IdempotencyConflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /study-plans/{planId}:
    parameters: [{$ref: '#/components/parameters/PlanId'}]
    get: {operationId: getStudyPlan, summary: 查询学习计划详情, responses: {'200': {$ref: '#/components/responses/StudyPlanOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    put: {operationId: updateStudyPlan, summary: 修改学习计划, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyPlanUpdateRequest'}}}}, responses: {'200': {$ref: '#/components/responses/StudyPlanOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
    delete: {operationId: deleteStudyPlan, summary: 删除学习计划, description: 对 study_plan 执行逻辑删除；任务不物理删除且不自动改为 CANCELLED，后续计划与任务查询通过父计划 deleted=0 隔离。, responses: {'204': {description: 删除成功}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /study-plans/{planId}/activate:
    parameters: [{$ref: '#/components/parameters/PlanId'}]
    post: {operationId: activateStudyPlan, summary: 激活学习计划, description: 仅允许 DRAFT 或 PAUSED 转为 ACTIVE；状态或乐观锁冲突返回 409；状态变化与不可变操作历史写入处于同一事务。, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyPlanStatusChangeRequest'}}}}, responses: {'200': {$ref: '#/components/responses/StudyPlanOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /study-plans/{planId}/pause:
    parameters: [{$ref: '#/components/parameters/PlanId'}]
    post: {operationId: pauseStudyPlan, summary: 暂停学习计划, description: 仅允许 ACTIVE 转为 PAUSED；状态或乐观锁冲突返回 409；状态变化与不可变操作历史写入处于同一事务。, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyPlanStatusChangeRequest'}}}}, responses: {'200': {$ref: '#/components/responses/StudyPlanOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /study-plans/{planId}/complete:
    parameters: [{$ref: '#/components/parameters/PlanId'}]
    post: {operationId: completeStudyPlan, summary: 完成学习计划, description: 允许 ACTIVE 或 PAUSED 转为 COMPLETED；不要求全部任务为终态，也不自动改变任何任务状态；状态变化与不可变操作历史写入处于同一事务。, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyPlanStatusChangeRequest'}}}}, responses: {'200': {$ref: '#/components/responses/StudyPlanOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /study-plans/{planId}/cancel:
    parameters: [{$ref: '#/components/parameters/PlanId'}]
    post: {operationId: cancelStudyPlan, summary: 取消学习计划, description: 允许 DRAFT、ACTIVE 或 PAUSED 转为 CANCELLED；不自动改变任务状态，COMPLETED、CANCELLED、EXPIRED 均为终态；状态变化与不可变操作历史写入处于同一事务。, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudyPlanStatusChangeRequest'}}}}, responses: {'200': {$ref: '#/components/responses/StudyPlanOne'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '500': {$ref: '#/components/responses/InternalServerError'}}}
  /study-plans/{planId}/tasks:
